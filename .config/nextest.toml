# Only used by the full ordinary and instrumented native CI suites.
# Start real wall-clock admission and liveness cases first, then overlap the
# other tests. No retries, no default exclusions, no shortened deadlines.
[profile.default]
test-threads = 4
retries = 0
fail-fast = false
default-filter = "all()"

[[profile.default.overrides]]
filter = 'test(=compiled_dual_mode_tui_invitation_import_apply_and_rollback)'
priority = 100

[[profile.default.overrides]]
filter = 'test(=production_h2_h3_asymmetric_traffic_half_close_and_idle)'
priority = 90
