name: Release binaries (build)

on:
  push:
    branches: [build, build/releases]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release / ${{ matrix.target }}
    if: github.ref == 'refs/heads/build' || github.ref == 'refs/heads/build/releases'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: theia
            artifact: theia-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: theia.exe
            artifact: theia-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_EXE: ${{ matrix.executable }}
      RELEASE_ARTIFACT: ${{ matrix.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable build revision
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout differs from requested build SHA'
          }
          if ($env:GITHUB_REF -notin @('refs/heads/build', 'refs/heads/build/releases')) {
            throw 'Release build is restricted to build branch'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-build-v1-${{ matrix.target }}
          cache-workspace-crates: false
          cache-bin: false
      - name: Compile optimized native binary
        run: |
          cargo build --locked --release --bin theia --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release compilation failed' }
      - name: Verify and stage standalone executable
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path "target/$env:RELEASE_TARGET/release" $env:RELEASE_EXE
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Binary missing' }
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Release executable cannot report its version' }
          $rust = rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiler' }
          $cargo = cargo -V
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Cargo' }
          if ($env:RELEASE_ARTIFACT.Length -gt 32 -or $env:RELEASE_ARTIFACT -notmatch '^[a-z0-9.-]+$') {
            throw 'Invalid artifact name'
          }
          $stage = Join-Path $env:RUNNER_TEMP 'theia-dist'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binary = Join-Path $stage $env:RELEASE_ARTIFACT
          Copy-Item -LiteralPath $exe -Destination $binary
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          $originalDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($digest -ne $originalDigest) { throw 'Staged binary differs from compiled binary' }
          "### ${{ matrix.target }} release-profile build" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Branch: $env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
          "Run: $env:GITHUB_RUN_ID / attempt $env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY
          "Binary: $env:RELEASE_ARTIFACT" >> $env:GITHUB_STEP_SUMMARY
          "Version: $($version -join '; ')" >> $env:GITHUB_STEP_SUMMARY
          "Binary SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY
          "Cargo: $cargo" >> $env:GITHUB_STEP_SUMMARY
          "Compiler:" >> $env:GITHUB_STEP_SUMMARY
          '~~~text' >> $env:GITHUB_STEP_SUMMARY
          $rust >> $env:GITHUB_STEP_SUMMARY
          '~~~' >> $env:GITHUB_STEP_SUMMARY
          "Experimental build only; acceptance and stable release publication are not performed here." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload raw executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/theia-dist/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 90


  publish:
    name: Publish experimental GitHub pre-release
    needs: release
    if: success() && (github.ref == 'refs/heads/build' || github.ref == 'refs/heads/build/releases')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Linux executable from this run
        uses: actions/download-artifact@v8
        with:
          name: theia-linux-x64
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - name: Download Windows executable from this run
        uses: actions/download-artifact@v8
        with:
          name: theia-windows-x64.exe
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - name: Verify and publish both binaries together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"
          test -s theia-linux-x64
          test -s theia-windows-x64.exe
          python3 - <<'PY'
          from pathlib import Path
          for name, magic in (("theia-linux-x64", b"\x7fELF"),
                              ("theia-windows-x64.exe", b"MZ")):
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Not a standalone file: {name}")
              with path.open("rb") as f:
                  if f.read(len(magic)) != magic:
                      raise SystemExit(f"Unexpected executable format: {name}")
          PY
          sha256sum theia-linux-x64 theia-windows-x64.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
          tag="dev-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          printf '%s\n' \
            'Experimental development build. Not a stable release or a release acceptance result.' \
            '' \
            "Source commit: $GITHUB_SHA" \
            "Source branch: $GITHUB_REF_NAME" \
            "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '' \
            'Assets: native Linux x64 and Windows x64 executables, plus SHA256SUMS.' \
            'On Linux, run chmod +x theia-linux-x64 after downloading if needed.' \
            'Dev configuration and key formats may change without backward compatibility.' \
            > "$notes"
          # gh creates a draft, uploads all assets, then publishes it.
          # Unique per-run/attempt tag: never overwrite a prior release.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Theia dev ${GITHUB_SHA:0:12} (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$notes" \
            --prerelease --latest=false \
            theia-linux-x64 theia-windows-x64.exe SHA256SUMS
          printf 'Published experimental pre-release: %s/%s/releases/tag/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
