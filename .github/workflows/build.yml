name: Release binaries (build)

on:
  push:
    branches: [build, build/releases]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release / ${{ matrix.target }}
    if: github.ref == 'refs/heads/build' || github.ref == 'refs/heads/build/releases'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: theia
            artifact: theia-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: theia.exe
            artifact: theia-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_EXE: ${{ matrix.executable }}
      RELEASE_ARTIFACT: ${{ matrix.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable build revision
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) {
            throw 'Checkout differs from requested build SHA'
          }
          if ($env:GITHUB_REF -notin @('refs/heads/build', 'refs/heads/build/releases')) {
            throw 'Release build is restricted to build branch'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-build-v1-${{ matrix.target }}
          cache-workspace-crates: false
          cache-bin: false
      - name: Compile optimized native binary
        run: |
          cargo build --locked --release --bin theia --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release compilation failed' }
      - name: Verify and stage standalone executable
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path "target/$env:RELEASE_TARGET/release" $env:RELEASE_EXE
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Binary missing' }
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Release executable cannot report its version' }
          $rust = rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiler' }
          $cargo = cargo -V
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Cargo' }
          if ($env:RELEASE_ARTIFACT.Length -gt 32 -or $env:RELEASE_ARTIFACT -notmatch '^[a-z0-9.-]+$') {
            throw 'Invalid artifact name'
          }
          $stage = Join-Path $env:RUNNER_TEMP 'theia-dist'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binary = Join-Path $stage $env:RELEASE_ARTIFACT
          Copy-Item -LiteralPath $exe -Destination $binary
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          $originalDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($digest -ne $originalDigest) { throw 'Staged binary differs from compiled binary' }
          "### ${{ matrix.target }} release-profile build" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Branch: $env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
          "Run: $env:GITHUB_RUN_ID / attempt $env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY
          "Binary: $env:RELEASE_ARTIFACT" >> $env:GITHUB_STEP_SUMMARY
          "Version: $($version -join '; ')" >> $env:GITHUB_STEP_SUMMARY
          "Binary SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY
          "Cargo: $cargo" >> $env:GITHUB_STEP_SUMMARY
          "Compiler:" >> $env:GITHUB_STEP_SUMMARY
          '~~~text' >> $env:GITHUB_STEP_SUMMARY
          $rust >> $env:GITHUB_STEP_SUMMARY
          '~~~' >> $env:GITHUB_STEP_SUMMARY
          "Build only; acceptance and stable release publication are not performed here." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload raw executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/theia-dist/${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 90
