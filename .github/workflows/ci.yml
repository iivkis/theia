name: CI (tests first)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification:
    name: specification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      rust_ready: ${{ steps.detect.outputs.rust_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Test documentation and TOML contracts
        run: bash scripts/check-spec.sh
      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f Cargo.lock ]]; then
            echo "rust_ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.toml ]]; then
            echo "::error::Cargo.toml exists but Cargo.lock is missing"
            exit 1
          else
            echo "::notice::Specification-only stage: Rust tests skipped until Cargo workspace exists"
            echo "rust_ready=false" >> "$GITHUB_OUTPUT"
          fi

  m0-1-api-spike:
    name: m0-1-api-spike (Linux)
    needs: specification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1"
      - name: Refresh isolated spike lockfile for added test-only dependencies
        run: cargo generate-lockfile --manifest-path spikes/m0_1/Cargo.toml
      - name: Test actual HTTP/2 duplex and API probes
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked
      - name: Check all targets
        run: cargo check --manifest-path spikes/m0_1/Cargo.toml --all-targets --locked
      - name: Emit updated lockfile for version pinning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          print("THEIA_M01_LOCK_START:" + base64.b64encode(Path("spikes/m0_1/Cargo.lock").read_bytes()).decode() + ":THEIA_M01_LOCK_END")
          PY
      - name: Validate pinned dependency tree
        run: cargo metadata --manifest-path spikes/m0_1/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

  m0-1-windows-spike:
    name: m0-1-api-spike (Windows)
    needs: specification
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1-windows"
      - name: Native Windows API spike tests
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked

  rust-tests:
    name: rust-tests (Linux)
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests first
        run: cargo test --workspace --all-targets --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release compilation only after main merge
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked

  windows-smoke:
    name: windows-smoke
    needs: [specification, rust-tests]
    if: needs.specification.outputs.rust_ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native Windows tests
        run: cargo test --workspace --all-targets --locked
      - name: Native Windows release compilation only after main merge
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked
