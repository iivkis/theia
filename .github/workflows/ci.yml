name: CI (tests first)

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  # Independent merged commits must not cancel one another.
  group: ci-main-merge-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  specification:
    name: specification
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      rust_ready: ${{ steps.detect.outputs.rust_ready }}
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact merged main commit
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$MERGED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
      - name: Preflight syntax and F-14 guest network regression before Rust
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests/ci -p 'test_f14_*.py'
      - name: Test documentation and TOML contracts
        run: bash scripts/check-spec.sh
      - name: Test required CI DAG and native E2E contract
        run: python3 tests/ci/check_workflow_parallel.py
      - name: Test conservative docs-only classifier and Git diff failure gates
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_scope.py' -v
      - name: Test independent TLS client input and frame boundaries
        run: python3 -m unittest discover -s tests/ci -p 'test_independent_h2_probe.py' -v
      - name: Test format-only repair safety and dispatch contract
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_format_repair.py' -v
      - name: Test CI timing evidence validation and comparison
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_timing.py' -v
      - name: Require full native CI for every merge
        id: scope
        shell: bash
        # Closed events do not reliably identify the previous main tip for
        # every merge strategy. Never skip a native check on ambiguous history.
        run: echo "native_required=true" >> "$GITHUB_OUTPUT"
      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f Cargo.lock ]]; then
            echo "rust_ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.toml ]]; then
            echo "::error::Cargo.toml exists but Cargo.lock is missing"
            exit 1
          else
            echo "::notice::Specification-only stage: Rust tests skipped until Cargo workspace exists"
            echo "rust_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        with:
          components: rustfmt
      - name: Reject formatting drift before expensive native builds
        id: format
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        run: python3 scripts/ci-format-repair.py probe

  m0-1-api-spike:
    name: m0-1-api-spike (Linux)
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      THEIA_BBR_RESULTS_PATH: ${{ github.workspace }}/theia-bbr-ubuntu-latest.csv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1"
      - name: Test actual HTTP/2 and HTTP/3 TLS transports
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked
      # Reuse this already-built isolated Cargo workspace instead of
      # provisioning another Linux/Windows BBR-only matrix.
      - name: Compare verified QUIC BBR and CUBIC with deterministic UDP impairment
        shell: pwsh
        run: |
          cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test quic_congestion_comparison comparison_records_all_controller_scenarios_ci_only -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison failed' }
      - name: Validate reproducibility and evidence coverage
        shell: pwsh
        run: |
          python tests/benchmark/check_bbr_comparison.py $env:THEIA_BBR_RESULTS_PATH
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-3-quic-comparison-${{ runner.os }}
          path: ${{ env.THEIA_BBR_RESULTS_PATH }}
          if-no-files-found: error
      - name: Report synthetic BBR loss recovery diagnostics (not a benchmark)
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test quic_bbr_loss -- --nocapture
      - name: Fingerprint baseline diagnostics (default rustls, NOT browser profile)
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test client_hello_baseline -- --nocapture
      - name: Check all targets
        run: cargo check --manifest-path spikes/m0_1/Cargo.toml --all-targets --locked
      - name: Validate pinned dependency tree
        run: cargo metadata --manifest-path spikes/m0_1/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent OpenSSL TLS1.3 H2 and strict certificate checks
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test independent_h2_loopback -- --ignored --nocapture
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-m3-3-bbr-comparison-ubuntu-latest
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  m0-1-windows-spike:
    name: m0-1-api-spike (Windows)
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      THEIA_BBR_RESULTS_PATH: ${{ github.workspace }}/theia-bbr-windows-latest.csv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1-windows"
      - name: Native Windows TLS/H2 and QUIC/H3 tests
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked
      # Reuse this already-built isolated Cargo workspace instead of
      # provisioning another Linux/Windows BBR-only matrix.
      - name: Compare verified QUIC BBR and CUBIC with deterministic UDP impairment
        shell: pwsh
        run: |
          cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test quic_congestion_comparison comparison_records_all_controller_scenarios_ci_only -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison failed' }
      - name: Validate reproducibility and evidence coverage
        shell: pwsh
        run: |
          python tests/benchmark/check_bbr_comparison.py $env:THEIA_BBR_RESULTS_PATH
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-3-quic-comparison-${{ runner.os }}
          path: ${{ env.THEIA_BBR_RESULTS_PATH }}
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent OpenSSL TLS1.3 H2 and strict certificate checks
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test independent_h2_loopback -- --ignored --nocapture
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-m3-3-bbr-comparison-windows-latest
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  rust-tests:
    name: rust-tests (Linux)
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only VT screen driver for real Linux PTY
        run: python -m pip install pyte==0.8.2
      - name: Tests first
        run: cargo test --workspace --all-targets --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build genuine Linux server for Windows cross-OS F-14 E2E
        run: cargo build --workspace --locked --bin theia
      - uses: actions/upload-artifact@v4
        with:
          name: f14-linux-server
          path: target/debug/theia
          if-no-files-found: error
          retention-days: 1
      # Optional release-profile compilation uses the same post-merge CI.
      # A release-build label on the merged PR opts in without another run.
      - name: Requested release compilation (Linux)
        if: contains(github.event.pull_request.labels.*.name, 'release-build')
        run: cargo build --workspace --release --locked
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-rust-tests-linux
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  windows-smoke:
    name: windows-smoke
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
      # MSVC emits very large default full-debuginfo PDBs for each Rust
      # integration test. Retain source line tables for failures, but omit
      # expensive variable/type DWARF/PDB metadata.  All tests, assertions,
      # TLS verification and actual Windows SID/ConPTY E2E still execute.
      # Profile-only change: not a release build or runtime security change.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only Windows ConPTY and VT screen drivers
        run: python -m pip install pywinpty==3.0.5 pyte==0.8.2
      - name: Native Windows tests
        run: cargo test --workspace --all-targets --locked
      - name: Disposable Windows user WinINet proxy CAS and restore (F-07)
        shell: pwsh
        env:
          THEIA_WINDOWS_PROXY_E2E_ALLOWED: "yes"
        run: |
          cargo test --workspace --locked windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'F-07 real WinINet proxy CAS and recovery failed' }
          cargo test --workspace --locked --test tui_real_terminal compiled_client_proxy_conpty_lifecycle -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'F-07 compiled ConPTY lifecycle failed' }
      - name: Cross-logon Windows pipe kernel-denial E2E (mandatory)
        shell: pwsh
        run: ./scripts/windows-cross-sid-ci.ps1
      - name: Stage Windows E2E binaries from Cargo JSON artifact paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Cargo may use target/debug/build/<crate>/<hash>/out instead of
          # target/debug/deps. Compiler-artifact JSON is the authoritative path.
          $testEvents = @(cargo test --workspace --locked --test f14_cross_host --no-run --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native F-14 harness' }
          $tests = @($testEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'f14_cross_host' -and $_.executable
          })
          if ($tests.Count -ne 1) { throw 'Expected exactly one compiled native F-14 test harness' }
          $binEvents = @(cargo build --workspace --locked --bin theia --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native Windows client' }
          $bins = @($binEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theia' -and $_.executable
          })
          if ($bins.Count -ne 1) { throw 'Expected exactly one compiled Windows client executable' }
          if (!(Test-Path $tests[0].executable -PathType Leaf)) { throw 'Missing compiled F-14 test harness' }
          if (!(Test-Path $bins[0].executable -PathType Leaf)) { throw 'Missing compiled Windows client' }
          Copy-Item $tests[0].executable (Join-Path $env:RUNNER_TEMP 'f14_cross_host.exe')
          Copy-Item $bins[0].executable (Join-Path $env:RUNNER_TEMP 'theia.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: f14-windows-compiled
          path: |
            ${{ runner.temp }}/f14_cross_host.exe
            ${{ runner.temp }}/theia.exe
          if-no-files-found: error
          retention-days: 1
      # Optional release-profile compilation uses the same post-merge CI.
      # A release-build label on the merged PR opts in without another run.
      - name: Requested release compilation (Windows)
        if: contains(github.event.pull_request.labels.*.name, 'release-build')
        run: cargo build --workspace --release --locked
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-windows-smoke-windows
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  f14-cross-host:
    name: F-14 Linux VM server to native Windows client
    needs: [specification, rust-tests, windows-smoke]
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: f14-linux-server
          path: ${{ runner.temp }}/theia-linux
      - uses: actions/download-artifact@v4
        with:
          name: f14-windows-compiled
          path: ${{ runner.temp }}/theia-windows
      # Pin the audited v7.2.0 tag commit, not a mutable branch.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3 openssl
      - name: Prove separate Linux VM kernel before starting E2E
        shell: pwsh
        run: |
          $kernel = wsl.exe --distribution Ubuntu-24.04 -- uname -s
          if ($LASTEXITCODE -ne 0 -or $kernel.Trim() -ne 'Linux') { throw 'No real Linux WSL2 kernel' }
      - name: Run native Windows import and real Linux H2/H3 end-to-end
        shell: pwsh
        run: |
          python scripts/f14-cross-os-ci.py --linux-binary "$env:RUNNER_TEMP/theia-linux/theia" --windows-test "$env:RUNNER_TEMP/theia-windows/f14_cross_host.exe" --windows-client "$env:RUNNER_TEMP/theia-windows/theia.exe"
          if ($LASTEXITCODE -ne 0) { throw 'F-14 Linux/Windows cross-OS E2E failed' }
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-f14-cross-host-cross-host
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  browser-e2e:
    name: browser-e2e (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only Playwright
        run: python -m pip install playwright==1.65.2
      - name: Provision Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Provision Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Verify Chromium navigation through the built Theia client
        run: cargo test --workspace --locked --test client_h2 client_binary_chromium_socks5 -- --ignored --exact --nocapture
      - name: Verify Chromium navigation over the explicit Theia H3 transport
        run: cargo test --workspace --locked --test client_h2 client_binary_chromium_socks5_over_h3 -- --ignored --exact --nocapture
      - name: Capture actual Chromium H2 SETTINGS and HPACK pseudo names on loopback
        run: cargo test --workspace --locked --test chromium_h2_reference actual_chromium_h2_settings_and_pseudo_order_reference -- --ignored --exact --nocapture
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-browser-e2e-${{ matrix.os }}
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  m3-4-btls-spike:
    name: m3-4-btls-spike (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m3_4 -> target"
          key: "m3-4-btls"
      - name: Real BoringSSL TCP first flight and strict TLS certificate matrix
        shell: pwsh
        run: |
          cargo test --manifest-path spikes/m3_4/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'BoringSSL candidate regressions failed' }
      - name: Isolated Clippy warnings as errors
        shell: pwsh
        run: |
          cargo clippy --manifest-path spikes/m3_4/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'M3.4 clippy failed' }

  m3-4e-btls-production-feature:
    name: m3-4e-btls-production-feature (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: "m3-4e-feature"
      - name: Verify production H2Client using optional BoringSSL TLS and real SmartTheia
        shell: pwsh
        run: |
          cargo test --workspace --locked --features experimental-btls-h2 --test client_btls_h2 -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Production BoringSSL H2/OPEN_OK regressions failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_wire_fingerprint -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4i actual H2 SETTINGS, WINDOW_UPDATE and pseudo capture failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_settings_feasibility -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4i bounded H2 flow-window API feasibility failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_client_shape -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4j H2 request order and parameterized credit research failed' }
      - name: Feature Clippy fails on warnings
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --features experimental-btls-h2 -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'M3.4e feature Clippy failed' }
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-m3-4e-btls-production-feature-${{ matrix.os }}
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  ci-gate:
    name: ci-gate
    needs: [specification, m0-1-api-spike, m0-1-windows-spike, rust-tests, windows-smoke, f14-cross-host, browser-e2e, m3-4-btls-spike, m3-4e-btls-production-feature]
    if: ${{ always() && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success of every mandatory CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          NATIVE_REQUIRED: ${{ needs.specification.outputs.native_required }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          expected = {"specification", "m0-1-api-spike", "m0-1-windows-spike", "rust-tests", "windows-smoke", "f14-cross-host", "browser-e2e", "m3-4-btls-spike", "m3-4e-btls-production-feature"}
          native = os.environ["NATIVE_REQUIRED"]
          if native != "true":
              raise SystemExit("Every merge requires full native CI; fail closed")
          failed = [name for name in sorted(expected) if results.get(name, {}).get("result") != "success"]
          if failed:
              raise SystemExit("CI results violate required scope: " + ", ".join(failed))
          print("Merged main commit: native CI passed.")
          PY

