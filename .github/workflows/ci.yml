      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: native-coverage-dependencies-v2
          workspaces: ". -> target/llvm-cov-target"
          cache-targets: true
          cache-workspace-crates: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real-terminal test dependencies
        run: python -m pip install pyte==0.8.2
      - name: Install pinned Windows ConPTY test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.5
      - name: Install native eBPF linker dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libbpf-dev nftables iproute2
      - name: Install independent protocol fixtures for instrumented interoperability
        run: python -m pip install h2==4.2.0 aioquic==1.2.0
      - name: Provision instrumented Chromium fixtures on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Provision instrumented Chromium fixtures on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install chromium
      - name: Purge any restored profile counters before instrumenting this SHA
        run: cargo llvm-cov clean --profraw-only
      - name: Instrument full native workspace tests
        run: cargo llvm-cov nextest --workspace --all-targets --all-features --locked --no-report --no-fail-fast
      - name: Instrument real disposable Windows proxy and ConPTY lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          THEIA_WINDOWS_PROXY_E2E_ALLOWED: "yes"
        run: |
          cargo llvm-cov test --workspace --all-features --locked --no-report --lib -- windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override \.\.\. ok') { throw 'Instrumented real WinINet CAS and recovery failed or did not execute' }
          cargo llvm-cov test --workspace --all-features --locked --no-report --test tui_real_terminal -- compiled_client_proxy_conpty_lifecycle --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test compiled_client_proxy_conpty_lifecycle \.\.\. ok') { throw 'Instrumented real ConPTY lifecycle failed or did not execute' }
      - name: Instrument actual F-15 isolated kernel tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n unshare -n true
          export CARGO_TARGET_DIR="$PWD/target/llvm-cov-target"
          export CARGO_LLVM_COV_TARGET_DIR="$CARGO_TARGET_DIR"
          source <(cargo llvm-cov show-env --sh)
          cargo test --locked -p theia --all-features --lib --no-run --message-format=json > f15-coverage-build.json
          python3 scripts/f15-kernel-tests.py f15-coverage-build.json --coverage
      - name: Instrument independent protocol and browser interoperability
        shell: pwsh
        run: |
          $cases = @(
            @{ target = @('--test', 'client_h2'); name = 'client_binary_chromium_socks5' },
            @{ target = @('--test', 'client_h2'); name = 'client_binary_chromium_socks5_over_h3' },
            @{ target = @('--test', 'independent_native_tls'); name = 'native_clients_require_pki_and_exact_alpn' },
            @{ target = @('--test', 'independent_native_quic'); name = 'independent_aioquic_v1_v2_bidirectional_h3' },
            @{ target = @('--lib'); name = 'routing::packet_modify::tests::independent_aioquic_initial_modify_v1_v2' },
            @{ target = @('--test', 'independent_quic_modify'); name = 'independent_aioquic_live_modify_v1_v2' },
            @{ target = @('--lib'); name = 'udp_relay::tests::independent_quic_product_relay_v1_v2' },
            @{ target = @('--lib'); name = 'server::hardening_tests::independent_external_reference_through_registered_reality_dispatchers' }
          )
          foreach ($case in $cases) {
            $target = $case.target
            $name = $case.name
            cargo llvm-cov test --workspace --all-features --locked --no-report @target -- $name --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
            if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw "Instrumented fixture failed or did not execute: $name" }
          }
      - name: Export LCOV once after all native instrumented tests
        run: cargo llvm-cov report --lcov --include-build-script --output-path coverage.lcov
      - name: Export independent LLVM file segments from the same profiles
        run: cargo llvm-cov report --json --include-build-script --output-path coverage-segments.json
      - name: Normalize exact-SHA native line evidence
        run: python scripts/ci-coverage.py collect --lcov coverage.lcov --llvm-json coverage-segments.json --platform "${{ runner.os }}" --sha "${{ needs.specification.outputs.tested_sha }}" --output coverage.json
      - name: Require actual privileged kernel coverage in normalized report
        if: runner.os == 'Linux'
        run: python scripts/f15-kernel-tests.py --verify-coverage coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve raw LLVM evidence when coverage collection fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-failure-${{ runner.os }}
          path: |
            coverage.lcov
            coverage-segments.json
          if-no-files-found: warn
          retention-days: 3

  coverage-gate:
    name: Production line coverage >= 80%
    needs: [specification, coverage-native]
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust syntax parser for test-only line exclusion
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-rust==0.24.2
      - name: Test Rust syntax based exclusion
        env:
          THEIA_COVERAGE_SYNTAX_TESTS: "required"
        run: python -m unittest discover -s tests/ci -p 'test_ci_coverage.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: coverage-Linux
          path: coverage-linux
      - uses: actions/download-artifact@v4
        with:
          name: coverage-Windows
          path: coverage-windows
      - name: Verify complete source inventory and union native line coverage
        run: python scripts/ci-coverage.py gate --linux coverage-linux/coverage.json --windows coverage-windows/coverage.json --sha "${{ needs.specification.outputs.tested_sha }}" --output coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  f15-driver-build:
    name: F-15 native backend prerequisites (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Compile the CO-RE collector against the runner kernel BTF
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-tools-generic
          uname -r
          # Runner sysfs may be readable only to root. Keep the actual
          # kernel's BTF, not a synthetic or unrelated vmlinux.h.
          btf="$RUNNER_TEMP/theia-vmlinux.btf"
          sudo install -m 0644 /sys/kernel/btf/vmlinux "$btf"
          test -s "$btf"
          bpftool_path="$(find -L /usr/lib/linux-tools -type f -name bpftool -print | sort -V | tail -n 1)"
          if [[ ! -x "$bpftool_path" ]]; then
            echo "::error::No executable bpftool in installed Linux tools packages"
            exit 1
          fi
          "$bpftool_path" version
          sha256sum "$btf"
          make -C drivers/linux CLANG=/usr/bin/clang BPFTOOL="$bpftool_path" BTF="$btf"
          llvm-objdump -h drivers/linux/theia_flow_events.bpf.o
          mkdir f15-build-evidence
          cp drivers/linux/theia_flow_events.bpf.o f15-build-evidence/
          sha256sum f15-build-evidence/theia_flow_events.bpf.o
      - name: Validate WinDivert package staging without installing a driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./drivers/windows/windivert/test-package.ps1
          Get-ChildItem drivers/windows/windivert -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell parser rejected $($_.Name): $errors" }
          }
      - name: Compile WFP guard and validate native BFE transactions (abort only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./drivers/windows/windivert/build-wfp-guard-lab.ps1 -OutputDirectory "$env:RUNNER_TEMP/theia-wfp-guard" -TestBfeTransaction
      - name: Verify independent dual-stack external socket fixture (loopback only)
        run: python drivers/windows/windivert/test-redirect-apps.py self-test
      - name: Record Windows package validation scope
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory f15-build-evidence | Out-Null
          [pscustomobject]@{SourceSha='${{ needs.specification.outputs.tested_sha }}';Backend='WinDivert';UpstreamVersion='2.2.2';PackageFixtureTests=$true;OfficialPackageVerified=$false;Installed=$false;CaptureReady=$false} | ConvertTo-Json | Set-Content f15-build-evidence/build-evidence.json
      - name: Publish exact-source native prerequisite evidence
        uses: actions/upload-artifact@v4
        with:
          name: f15-driver-build-${{ runner.os }}-${{ needs.specification.outputs.tested_sha }}
          path: |
            f15-build-evidence/*.o
            f15-build-evidence/hashes.json
            f15-build-evidence/build-evidence.json
          if-no-files-found: error
          retention-days: 3

  ci-gate:
    name: ci-gate
    needs: [specification, m0-1-api-spike, m0-1-windows-spike, rust-tests, windows-smoke, f14-cross-host, f14-build, browser-e2e, native-performance, f19-performance, m3-4-btls-spike, m3-4e-btls-production-feature, coverage-native, coverage-gate, f15-driver-build]
    if: ${{ always() && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success of every mandatory CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          NATIVE_REQUIRED: ${{ needs.specification.outputs.native_required }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TESTED_SHA: ${{ needs.specification.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          results = json.loads(os.environ["JOB_RESULTS"])
          expected = {"specification", "m0-1-api-spike", "m0-1-windows-spike", "rust-tests", "windows-smoke", "f14-cross-host", "f14-build", "browser-e2e", "native-performance", "f19-performance", "m3-4-btls-spike", "m3-4e-btls-production-feature", "coverage-native", "coverage-gate", "f15-driver-build"}
          native = os.environ["NATIVE_REQUIRED"]
          if native != "true":
              raise SystemExit("Every merge requires full native CI; fail closed")
          failed = [name for name in sorted(expected) if results.get(name, {}).get("result") != "success"]
          if failed:
              raise SystemExit("CI results violate required scope: " + ", ".join(failed))
          merged = os.environ["MERGED_SHA"]
          tested = os.environ["TESTED_SHA"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (merged, tested)):
              raise SystemExit("Missing exact source provenance")
          message = f"Merge {merged}: native CI passed on exact source {tested}"
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(message + "\n")
          PY

