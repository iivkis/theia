name: CI (merged dev)

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Closed PR runs otherwise receive read-only cache access. Only the trusted
# post-merge native dependency-cache producers below may write caches.
# No cache is restored by the privileged source-publication job.
cache-mode: read

concurrency:
  # Independent merged commits must not cancel one another.
  group: ci-main-merge-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  specification:
    name: specification
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Only this trusted same-repository post-merge job may publish
    # a verified Rustfmt-only direct child. Native jobs stay read-only.
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.publish-format.outputs.tested_sha }}
      rust_ready: ${{ steps.detect.outputs.rust_ready }}
      rust_release: ${{ steps.compiler.outputs.release }}
      rust_commit: ${{ steps.compiler.outputs.commit }}
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact merged main commit
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$PR_HEAD" = dev
          test "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$MERGED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
      - name: Preflight syntax and F-14 guest network regression before Rust
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests/ci -p 'test_f14_*.py'
      - name: Test documentation and TOML contracts
        run: bash scripts/check-spec.sh
      - name: Test required CI DAG and native E2E contract
        run: python3 tests/ci/check_workflow_parallel.py
      - name: Test conservative docs-only classifier and Git diff failure gates
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_scope.py' -v
      - name: Test independent TLS client input and frame boundaries
        run: python3 -m unittest discover -s tests/ci -p 'test_independent_h2_probe.py' -v
      - name: Test format-only repair safety and dispatch contract
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_format_repair.py' -v
      - name: Test CI timing evidence validation and comparison
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_timing.py' -v
      - name: Test same-run BoringSSL bundle provenance and digest contract
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_boringssl.py'
      - name: Test coverage evidence parser and threshold
        run: python3 -m unittest discover -s tests/ci -p 'test_ci_coverage.py' -v
      - name: Require full native CI for every merge
        id: scope
        shell: bash
        # Closed events do not reliably identify the previous main tip for
        # every merge strategy. Never skip a native check on ambiguous history.
        run: echo "native_required=true" >> "$GITHUB_OUTPUT"
      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f Cargo.lock ]]; then
            echo "rust_ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.toml ]]; then
            echo "::error::Cargo.toml exists but Cargo.lock is missing"
            exit 1
          else
            echo "::notice::Specification-only stage: Rust tests skipped until Cargo workspace exists"
            echo "rust_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        with:
          components: rustfmt
      - name: Record exact stable compiler and test native toolchain selection
        id: compiler
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        run: |
          python3 scripts/ci-rust-toolchain.py record
          python3 -m unittest discover -s tests/ci -p 'test_ci_rust_toolchain.py'
      - name: Verify exhaustive Cargo target groups before fan-out
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        run: |
          python3 scripts/ci-native-targets.py
          python3 -m unittest discover -s tests/ci -p 'test_ci_native_targets.py'
      - name: Prepare verified Rustfmt-only child of merged main
        id: format
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 scripts/ci-format-repair.py prepare-merged
      - name: Publish exact formatted source once (no additional CI trigger)
        id: publish-format
        if: steps.detect.outputs.rust_ready == 'true' && steps.scope.outputs.native_required == 'true'
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEV_SHA: ${{ github.event.pull_request.head.sha }}
          FORMATTED_SHA: ${{ steps.format.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$MERGED_SHA" "$DEV_SHA" "$FORMATTED_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$FORMATTED_SHA"
          TESTED_SHA="$FORMATTED_SHA" python3 scripts/ci-format-repair.py verify-merged
          if [[ "$FORMATTED_SHA" != "$MERGED_SHA" ]]; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
            git fetch --no-tags --depth=2 origin refs/heads/main
            tip="$(git rev-parse FETCH_HEAD)"
            if [[ "$tip" == "$MERGED_SHA" ]]; then
              dev="$(git ls-remote --exit-code origin refs/heads/dev | cut -f1)"
              if [[ "$dev" == "$DEV_SHA" ]] && git merge-base --is-ancestor "$DEV_SHA" "$FORMATTED_SHA"; then
                # Atomically sync dev only if it has no subsequent work.
                git push --atomic origin "$FORMATTED_SHA:refs/heads/main" "$FORMATTED_SHA:refs/heads/dev"
              else
                git push origin "$FORMATTED_SHA:refs/heads/main"
                echo "::notice::dev advanced or is not an ancestor; left unchanged"
              fi
            elif [[ "$(git show -s --format=%P "$tip")" == "$MERGED_SHA" ]] && \
                 [[ "$(git rev-parse "$tip^{tree}")" == "$(git rev-parse "$FORMATTED_SHA^{tree}")" ]]; then
              # Rerun: reuse the already-published identical child.
              FORMATTED_SHA="$tip"
              git checkout --detach "$FORMATTED_SHA"
            else
              echo "::error::main advanced; refuse to rewrite a newer integration"
              exit 1
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN auth
          fi
          TESTED_SHA="$FORMATTED_SHA" python3 scripts/ci-format-repair.py verify-merged
          echo "tested_sha=$FORMATTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'Merged SHA: %s\nTested source SHA: %s\n' "$MERGED_SHA" "$FORMATTED_SHA" >> "$GITHUB_STEP_SUMMARY"

  f14-build:
    name: F-14 native build (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Build against the same Ubuntu release as the WSL 2 execution host.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Select exact verified native Rust toolchain
        env:
          CI_RUST_RELEASE: ${{ needs.specification.outputs.rust_release }}
          CI_RUST_COMMIT: ${{ needs.specification.outputs.rust_commit }}
        run: python scripts/ci-rust-toolchain.py prepare
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-default-deps-v4
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
      - name: Verify native product graph has no Quinn packages
        shell: bash
        run: |
          cargo tree --locked -p theia -e normal,build --all-features --prefix none > normal-dependencies.txt
          if grep -E '^(quinn|quinn-proto|quinn-udp|h3-quinn) v' normal-dependencies.txt; then
            echo "::error::Quinn leaked into product dependencies"
            exit 1
          fi
      - name: Build genuine Linux server for Windows cross-OS F-14 E2E
        if: runner.os == 'Linux'
        run: cargo build --workspace --locked --bin theia
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: f14-linux-server
          path: target/debug/theia
          if-no-files-found: error
          retention-days: 1
      - name: Stage Windows E2E binaries from Cargo JSON artifact paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Cargo may use target/debug/build/<crate>/<hash>/out instead of
          # target/debug/deps. Compiler-artifact JSON is the authoritative path.
          $eventFile = Join-Path $env:RUNNER_TEMP 'f14-cargo-events.jsonl'
          $testEvents = @(cargo test --workspace --locked --test f14_cross_host --no-run --message-format=json |
            Tee-Object -FilePath $eventFile |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native F-14 harness' }
          $tests = @($testEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'f14_cross_host' -and $_.executable
          })
          if ($tests.Count -ne 1) { throw 'Expected exactly one compiled native F-14 test harness' }
          # Integration-test compilation normally builds the executable too.
          # Reuse only a real non-harness bin from this exact Cargo invocation.
          $bins = @($testEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theia' -and
              $_.target.kind -contains 'bin' -and $_.profile.test -eq $false -and $_.executable
          })
          if ($bins.Count -eq 0) {
            $binEvents = @(cargo build --workspace --locked --bin theia --message-format=json |
              ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
            if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native Windows client' }
            $bins = @($binEvents | Where-Object {
              $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theia' -and
                $_.target.kind -contains 'bin' -and $_.profile.test -eq $false -and $_.executable
            })
          }
          if ($bins.Count -ne 1) { throw 'Expected exactly one compiled Windows client executable' }
          if (!(Test-Path $tests[0].executable -PathType Leaf)) { throw 'Missing compiled F-14 test harness' }
          if (!(Test-Path $bins[0].executable -PathType Leaf)) { throw 'Missing compiled Windows client' }
          Copy-Item $tests[0].executable (Join-Path $env:RUNNER_TEMP 'f14_cross_host.exe')
          Copy-Item $bins[0].executable (Join-Path $env:RUNNER_TEMP 'theia.exe')
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: f14-windows-compiled
          path: |
            ${{ runner.temp }}/f14_cross_host.exe
            ${{ runner.temp }}/theia.exe
          if-no-files-found: error
          retention-days: 1
      - name: Stage exact native BoringSSL libraries and patched headers for Clippy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci-boringssl.py stage --events "$env:RUNNER_TEMP/f14-cargo-events.jsonl" --bundle "$env:RUNNER_TEMP/theia-boringssl" --sha "${{ needs.specification.outputs.tested_sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'BoringSSL bundle staging failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: f14-windows-boringssl
          path: ${{ runner.temp }}/theia-boringssl
          if-no-files-found: error
          retention-days: 1
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-f14-build-${{ matrix.os }}
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  rust-tests:
    name: rust-tests (Linux, shard ${{ matrix.shard }}/2)
    needs: specification
    cache-mode: write
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Select exact verified native Rust toolchain
        env:
          CI_RUST_RELEASE: ${{ needs.specification.outputs.rust_release }}
          CI_RUST_COMMIT: ${{ needs.specification.outputs.rust_commit }}
        run: python scripts/ci-rust-toolchain.py prepare --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-default-deps-v4
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ matrix.shard == 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only VT screen driver for real Linux PTY
        if: matrix.shard == 2
        run: python -m pip install --disable-pip-version-check --no-input pyte==0.8.2
      - name: Native Linux unit and binary tests
        if: matrix.shard == 1
        run: cargo nextest run --workspace --lib --bins --locked --no-fail-fast
      - name: Native Linux integration tests
        if: matrix.shard == 2
        run: cargo nextest run --workspace --test '*' --locked --no-fail-fast
      - name: Install native eBPF linker for all-feature lint
        if: matrix.shard == 1
        run: sudo apt-get install -y --no-install-recommends libbpf-dev
      - name: Linux all-feature Clippy
        if: matrix.shard == 1
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-rust-tests-linux-${{ matrix.shard }}
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  windows-smoke:
    name: windows-smoke (shard ${{ matrix.shard }}/2)
    needs: specification
    cache-mode: write
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
      # MSVC emits very large default full-debuginfo PDBs for each Rust
      # integration test. Retain source line tables for failures, but omit
      # expensive variable/type DWARF/PDB metadata.  All tests, assertions,
      # TLS verification and actual Windows SID/ConPTY E2E still execute.
      # Profile-only change: not a release build or runtime security change.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Select exact verified native Rust toolchain
        env:
          CI_RUST_RELEASE: ${{ needs.specification.outputs.rust_release }}
          CI_RUST_COMMIT: ${{ needs.specification.outputs.rust_commit }}
        run: python scripts/ci-rust-toolchain.py prepare
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-default-deps-v4
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ matrix.shard == 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only Windows ConPTY and VT screen drivers
        if: matrix.shard == 2
        run: python -m pip install --disable-pip-version-check --no-input pywinpty==3.0.5 pyte==0.8.2
      - name: Native Windows unit and binary tests
        if: matrix.shard == 1
        run: cargo nextest run --workspace --lib --bins --locked --no-fail-fast
      - name: Native Windows integration tests
        if: matrix.shard == 2
        run: cargo nextest run --workspace --test '*' --locked --no-fail-fast
      - name: Cross-logon Windows pipe kernel-denial E2E (mandatory)
        if: matrix.shard == 1
        shell: pwsh
        run: ./scripts/windows-cross-sid-ci.ps1
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-windows-smoke-windows-${{ matrix.shard }}
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  native-checks:
    name: Native prerequisite (${{ matrix.check }})
    needs: [specification, f14-build]
    cache-mode: write
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            check: windows-clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Select exact verified native Rust toolchain
        env:
          CI_RUST_RELEASE: ${{ needs.specification.outputs.rust_release }}
          CI_RUST_COMMIT: ${{ needs.specification.outputs.rust_commit }}
        run: python scripts/ci-rust-toolchain.py prepare --component clippy
      # Cold check cache: seed from the existing trusted default dependency
      # cache instead of fetching and recompiling the entire dependency graph.
      - uses: Swatinem/rust-cache@v2
        id: clippy-cache
        with:
          shared-key: native-clippy-deps-v2
          cache-workspace-crates: false
          cache-bin: false
          save-if: true
      - uses: Swatinem/rust-cache@v2
        if: steps.clippy-cache.outputs.cache-hit != 'true'
        with:
          shared-key: native-default-deps-v4
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: f14-windows-boringssl
          path: ${{ runner.temp }}/theia-boringssl
      - name: Verify same-run native BoringSSL bundle
        shell: pwsh
        run: |
          python scripts/ci-boringssl.py verify --bundle "$env:RUNNER_TEMP/theia-boringssl" --sha "${{ needs.specification.outputs.tested_sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'BoringSSL provenance check failed' }
      - name: Production feature Clippy (Windows)
        if: matrix.check == 'windows-clippy'
        env:
          BORING_BSSL_PATH: ${{ runner.temp }}/theia-boringssl
        run: cargo clippy --workspace --all-targets --features experimental-btls-h2 --locked -- -D warnings



  f14-cross-host:
    name: F-14 Linux VM server to native Windows client
    # Start WSL2 as soon as the exact native binaries exist; do not wait
    # for browser, performance, or full native test suites.
    needs: [specification, f14-build]
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      THEIA_TRACE_DIR: ${{ github.workspace }}/theia-traces
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: f14-linux-server
          path: ${{ runner.temp }}/theia-linux
      - uses: actions/download-artifact@v4
        with:
          name: f14-windows-compiled
          path: ${{ runner.temp }}/theia-windows
      # Pin the audited v7.2.0 tag commit, not a mutable branch.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
      - name: Verify guest fixture dependencies; install only when missing
        shell: pwsh
        run: |
          wsl.exe --distribution Ubuntu-24.04 -- sh -ec 'command -v python3 >/dev/null && command -v openssl >/dev/null'
          if ($LASTEXITCODE -ne 0) {
            wsl.exe --distribution Ubuntu-24.04 --user root -- apt-get update
            if ($LASTEXITCODE -ne 0) { throw 'WSL package index update failed' }
            wsl.exe --distribution Ubuntu-24.04 --user root -- apt-get install --yes --no-install-recommends python3 openssl
            if ($LASTEXITCODE -ne 0) { throw 'WSL fixture dependency installation failed' }
          }
          wsl.exe --distribution Ubuntu-24.04 -- python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          if ($LASTEXITCODE -ne 0) { throw 'WSL fixture requires Python >= 3.10' }
          wsl.exe --distribution Ubuntu-24.04 -- openssl version
          if ($LASTEXITCODE -ne 0) { throw 'WSL OpenSSL fixture unavailable' }
      - name: Prove separate Linux VM kernel before starting E2E
        shell: pwsh
        run: |
          $kernel = wsl.exe --distribution Ubuntu-24.04 -- uname -s
          if ($LASTEXITCODE -ne 0 -or $kernel.Trim() -ne 'Linux') { throw 'No real Linux WSL2 kernel' }
      - name: Run native Windows import and real Linux H2/H3 end-to-end
        shell: pwsh
        run: |
          python scripts/f14-cross-os-ci.py --linux-binary "$env:RUNNER_TEMP/theia-linux/theia" --windows-test "$env:RUNNER_TEMP/theia-windows/f14_cross_host.exe" --windows-client "$env:RUNNER_TEMP/theia-windows/theia.exe"
          if ($LASTEXITCODE -ne 0) { throw 'F-14 Linux/Windows cross-OS E2E failed' }
      - name: Upload sanitized trace logs on CI failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-traces-f14-cross-host-cross-host
          path: ${{ env.THEIA_TRACE_DIR }}/*.log*
          if-no-files-found: ignore
          retention-days: 3

  coverage-native:
    name: Coverage instrumented (${{ matrix.os }}, shard ${{ matrix.shard }}/6)
    needs: specification
    cache-mode: write
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - name: Select exact verified native Rust toolchain
        env:
          CI_RUST_RELEASE: ${{ needs.specification.outputs.rust_release }}
          CI_RUST_COMMIT: ${{ needs.specification.outputs.rust_commit }}
        run: python scripts/ci-rust-toolchain.py prepare --component llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@v2
        if: matrix.shard <= 2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: native-coverage-dependencies-v2
          workspaces: ". -> target/llvm-cov-target"
          cache-targets: true
          cache-workspace-crates: false
          save-if: ${{ matrix.shard == 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Linux terminal test dependencies
        if: runner.os == 'Linux' && (matrix.shard == 2 || matrix.shard == 3)
        run: python -m pip install --disable-pip-version-check --no-input pyte==0.8.2
      - name: Install pinned Windows terminal test dependencies
        if: runner.os == 'Windows' && (matrix.shard == 2 || matrix.shard == 3 || matrix.shard == 4)
        run: python -m pip install --disable-pip-version-check --no-input pyte==0.8.2 pywinpty==3.0.5
      - name: Install native eBPF linker dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libbpf-dev
      - name: Install independent protocol fixtures for instrumented interoperability
        if: matrix.shard >= 5
        run: python -m pip install h2==4.2.0 aioquic==1.2.0
      - name: Provision instrumented Chromium fixtures on Linux
        if: runner.os == 'Linux' && matrix.shard == 4
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Provision instrumented Chromium fixtures on Windows
        if: runner.os == 'Windows' && matrix.shard == 4
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install chromium
      - name: Purge any restored profile counters before instrumenting this SHA
        run: cargo llvm-cov clean --profraw-only
      - name: Instrument all native unit and binary tests
        if: matrix.shard == 1
        run: cargo llvm-cov nextest --workspace --lib --bins --all-features --locked --no-report --no-fail-fast
      - name: Instrument real disposable Windows WinINet lifecycle
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        env:
          THEIA_WINDOWS_PROXY_E2E_ALLOWED: "yes"
        run: |
          cargo llvm-cov test --workspace --all-features --locked --no-report --lib -- windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override \.\.\. ok') { throw 'Instrumented real WinINet CAS and recovery failed or did not execute' }
      - name: Instrument all native integration tests
        if: matrix.shard == 2
        run: cargo llvm-cov nextest --workspace --test '*' --all-features --locked --no-report --no-fail-fast
      - name: Instrument real dual-mode TUI and startup replay guard
        if: matrix.shard == 3
        shell: pwsh
        run: |
          cargo llvm-cov test --workspace --all-features --locked --no-report --test tui_real_terminal -- compiled_dual_mode_tui_invitation_import_apply_and_rollback --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Real startup replay guard and dual-mode TUI did not pass' }
      - name: Instrument independent protocol and browser interoperability
        if: matrix.shard >= 4
        shell: pwsh
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          $cases = @(
            @{ target = @('--test', 'client_h2'); name = 'client_binary_chromium_socks5'; shard = 4 },
            @{ target = @('--test', 'client_h2'); name = 'client_binary_chromium_socks5_over_h3'; shard = 4 },
            @{ target = @('--test', 'independent_native_tls'); name = 'native_clients_require_pki_and_exact_alpn'; shard = 5 },
            @{ target = @('--test', 'independent_native_quic'); name = 'independent_aioquic_v1_v2_bidirectional_h3'; shard = 5 },
            @{ target = @('--lib'); name = 'routing::packet_modify::tests::independent_aioquic_initial_modify_v1_v2'; shard = 5 },
            @{ target = @('--test', 'independent_quic_modify'); name = 'independent_aioquic_live_modify_v1_v2'; shard = 6 },
            @{ target = @('--lib'); name = 'udp_relay::tests::independent_quic_product_relay_v1_v2'; shard = 6 },
            @{ target = @('--lib'); name = 'server::hardening_tests::independent_external_reference_through_registered_reality_dispatchers'; shard = 6 }
          )
          $cases = @($cases | Where-Object { $_.shard -eq [int]$env:COVERAGE_SHARD })
          if ($cases.Count -eq 0) { throw 'No mandatory fixtures assigned to coverage shard' }
          foreach ($case in $cases) {
            $target = $case.target
            $name = $case.name
            cargo llvm-cov test --workspace --all-features --locked --no-report @target -- $name --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
            if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw "Instrumented fixture failed or did not execute: $name" }
          }
      - name: Instrument real disposable Windows ConPTY lifecycle
        if: runner.os == 'Windows' && matrix.shard == 4
        shell: pwsh
        env:
          THEIA_WINDOWS_PROXY_E2E_ALLOWED: "yes"
        run: |
          cargo llvm-cov test --workspace --all-features --locked --no-report --test tui_real_terminal -- compiled_client_proxy_conpty_lifecycle --ignored --exact --nocapture 2>&1 | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch 'test compiled_client_proxy_conpty_lifecycle \.\.\. ok') { throw 'Instrumented real ConPTY lifecycle failed or did not execute' }
      - name: Export LCOV once after all native instrumented tests
        run: cargo llvm-cov report --lcov --include-build-script --output-path coverage.lcov
      - name: Export independent LLVM file segments from the same profiles
        run: cargo llvm-cov report --json --include-build-script --output-path coverage-segments.json
      - name: Normalize exact-SHA native line evidence
        run: python scripts/ci-coverage.py collect --lcov coverage.lcov --llvm-json coverage-segments.json --platform "${{ runner.os }}" --shard ${{ matrix.shard }} --shards 6 --sha "${{ needs.specification.outputs.tested_sha }}" --output coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ runner.os }}-${{ matrix.shard }}
          path: coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve raw LLVM evidence when coverage collection fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-failure-${{ runner.os }}-${{ matrix.shard }}
          path: |
            coverage.lcov
            coverage-segments.json
          if-no-files-found: warn
          retention-days: 3

  coverage-gate:
    name: Production line coverage >= 80%
    needs: [specification, coverage-native]
    if: needs.specification.outputs.rust_ready == 'true' && needs.specification.outputs.native_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.specification.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust syntax parser for test-only line exclusion
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-rust==0.24.2
      - name: Test Rust syntax based exclusion
        env:
          THEIA_COVERAGE_SYNTAX_TESTS: "required"
        run: python -m unittest discover -s tests/ci -p 'test_ci_coverage.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: false
      - name: Verify complete source inventory and union native line coverage
        run: python scripts/ci-coverage.py gate --reports-dir coverage-shards --shards 6 --sha "${{ needs.specification.outputs.tested_sha }}" --output coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: ci-gate
    needs: [specification, rust-tests, windows-smoke, native-checks, f14-build, f14-cross-host, coverage-native, coverage-gate]
    if: ${{ always() && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Measure total CI elapsed time including runner queues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > ci-run-timing.json
      - name: Require success of every mandatory CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          NATIVE_REQUIRED: ${{ needs.specification.outputs.native_required }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TESTED_SHA: ${{ needs.specification.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          results = json.loads(os.environ["JOB_RESULTS"])
          expected = {"specification", "rust-tests", "windows-smoke", "native-checks", "f14-build", "f14-cross-host", "coverage-native", "coverage-gate"}
          native = os.environ["NATIVE_REQUIRED"]
          if native != "true":
              raise SystemExit("Every merge requires full native CI; fail closed")
          failed = [name for name in sorted(expected) if results.get(name, {}).get("result") != "success"]
          with open("ci-run-timing.json", encoding="utf-8") as timing:
              run = json.load(timing)
          if (run.get("id") != int(os.environ["GITHUB_RUN_ID"])
              or run.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])):
              raise SystemExit("CI timing provenance mismatch")
          start = run["created_at"] if run["run_attempt"] == 1 else run["run_started_at"]
          elapsed = (datetime.now(timezone.utc) - datetime.fromisoformat(start.replace("Z", "+00:00"))).total_seconds()
          timing = f"MVP CI elapsed before final gate: {elapsed:.1f}s (budget 300s)"
          print(timing)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(timing + "\n")
          if elapsed < 0 or elapsed > 300:
              failed.append("wall-clock budget (300s)")
          if failed:
              raise SystemExit("CI results violate required scope: " + ", ".join(failed))
          merged = os.environ["MERGED_SHA"]
          tested = os.environ["TESTED_SHA"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (merged, tested)):
              raise SystemExit("Missing exact source provenance")
          message = f"Merge {merged}: native CI passed on exact source {tested}"
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(message + "\n")
          PY

