name: CI (tests first)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new CI DAG epoch isolates this job topology from an unresponsive
  # cancelled v1 Windows runner. PR head supersession still cancels within v2.
  group: ci-native-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification:
    name: specification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      rust_ready: ${{ steps.detect.outputs.rust_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight syntax and F-14 guest network regression before Rust
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests/ci -p 'test_f14_*.py'
      - name: Test documentation and TOML contracts
        run: bash scripts/check-spec.sh
      - name: Test required CI DAG, native E2E and Go cache contract
        run: python3 tests/ci/check_workflow_parallel.py
      - name: Verify CI format artifact isolation
        run: python3 tests/ci/test_format_artifact.py
      - name: Detect Rust workspace
        id: detect
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f Cargo.lock ]]; then
            echo "rust_ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.toml ]]; then
            echo "::error::Cargo.toml exists but Cargo.lock is missing"
            exit 1
          else
            echo "::notice::Specification-only stage: Rust tests skipped until Cargo workspace exists"
            echo "rust_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.rust_ready == 'true'
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.rust_ready == 'true'
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - name: Format root Rust, independent spikes, and pinned Go test helpers
        if: steps.detect.outputs.rust_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --manifest-path spikes/m0_1/Cargo.toml --all
          cargo fmt --manifest-path spikes/m3_4/Cargo.toml --all
          mapfile -d '' -t go_files < <(git ls-files -z -- '*.go')
          if (( ${#go_files[@]} )); then gofmt -w "${go_files[@]}"; fi
          python3 scripts/ci-format.py "$RUNNER_TEMP/ci-formatted-source.tar"
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.rust_ready == 'true'
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source.tar
          if-no-files-found: error
          retention-days: 2

  m0-1-api-spike:
    name: m0-1-api-spike (Linux)
    needs: specification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1"
      - name: Test actual HTTP/2 and HTTP/3 TLS transports
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked
      - name: Report synthetic BBR loss recovery diagnostics (not a benchmark)
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test quic_bbr_loss -- --nocapture
      - name: Fingerprint baseline diagnostics (default rustls, NOT browser profile)
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test client_hello_baseline -- --nocapture
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - name: Generate Go uTLS Chrome133 reference and compare with rustls
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/theia-utls-h2-hello.bin"' EXIT
          pushd spikes/m0_1/utls_reference
          go mod verify
          go test ./...
          go run . "$RUNNER_TEMP/theia-utls-h2-hello.bin"
          popd
          THEIA_UTLS_HELLO_PATH="$RUNNER_TEMP/theia-utls-h2-hello.bin" cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test utls_reference -- --ignored --nocapture
          THEIA_UTLS_HELLO_PATH="$RUNNER_TEMP/theia-utls-h2-hello.bin" cargo test --workspace --locked --test fingerprint_h2 -- --ignored --nocapture
          rm -f "$RUNNER_TEMP/theia-utls-h2-hello.bin"
      - name: Real Go uTLS H2 request and strict certificate verification against Rust server
        shell: bash
        run: |
          set -euo pipefail
          pushd spikes/m0_1/utls_reference
          go build -o "$RUNNER_TEMP/theia-utls-h2-probe" ./cmd/h2_probe
          popd
          THEIA_UTLS_H2_PROBE="$RUNNER_TEMP/theia-utls-h2-probe" cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test utls_h2_loopback -- --ignored --nocapture
      - name: Rustfmt check for isolated M0.1 spike
        run: cargo fmt --manifest-path spikes/m0_1/Cargo.toml --all -- --check
      - name: Check Go uTLS helpers formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l spikes/m0_1/utls_reference/main.go spikes/m0_1/utls_reference/main_test.go spikes/m0_1/utls_reference/cmd/h2_probe/main.go spikes/m0_1/utls_reference/cmd/h2_probe/main_test.go)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt drift: $unformatted"
            exit 1
          fi
      - name: Check all targets
        run: cargo check --manifest-path spikes/m0_1/Cargo.toml --all-targets --locked
      - name: Validate pinned dependency tree
        run: cargo metadata --manifest-path spikes/m0_1/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

  m0-1-windows-spike:
    name: m0-1-api-spike (Windows)
    needs: specification
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m0-1-windows"
      - name: Native Windows TLS/H2 and QUIC/H3 tests
        run: cargo test --manifest-path spikes/m0_1/Cargo.toml --locked
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - name: Native Windows Go uTLS reference and Rust comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location spikes/m0_1/utls_reference
          go test ./...
          $hello = Join-Path $env:RUNNER_TEMP "theia-utls-h2-hello.bin"
          go run . $hello
          if ($LASTEXITCODE -ne 0) { throw 'Go uTLS reference failed' }
          Pop-Location
          $env:THEIA_UTLS_HELLO_PATH = $hello
          cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test utls_reference -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Rust comparison to Go uTLS failed' }
          Remove-Item $hello -Force
      - name: Real Windows Go uTLS H2 handshake and PKI negative tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location spikes/m0_1/utls_reference
          $env:THEIA_UTLS_H2_PROBE = Join-Path $env:RUNNER_TEMP "theia-utls-h2-probe.exe"
          go build -o $env:THEIA_UTLS_H2_PROBE ./cmd/h2_probe
          if ($LASTEXITCODE -ne 0) { throw 'build Go H2 probe failed' }
          Pop-Location
          cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test utls_h2_loopback -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Go uTLS and Rust H2 E2E failed' }

  rust-tests:
    name: rust-tests (Linux)
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only VT screen driver for real Linux PTY
        run: python -m pip install pyte==0.8.2
      - name: Tests first
        run: cargo test --workspace --all-targets --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build genuine Linux server for Windows cross-OS F-14 E2E
        run: cargo build --workspace --locked --bin theia
      - uses: actions/upload-artifact@v4
        with:
          name: f14-linux-server
          path: target/debug/theia
          if-no-files-found: error
          retention-days: 1
      - name: Release compilation only after main merge
        if: github.ref == 'refs/heads/main'
        run: cargo build --workspace --release --locked

  windows-smoke:
    name: windows-smoke
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only Windows ConPTY and VT screen drivers
        run: python -m pip install pywinpty==3.0.5 pyte==0.8.2
      - name: Native Windows tests
        run: cargo test --workspace --all-targets --locked
      # The root fingerprint test executable has already been built by the
      # --all-targets command above. Running it in the M0.1 spike job instead
      # rebuilt the entire root workspace for 5+ minutes on Windows.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - name: Real Windows live Theia H2 fingerprint vs pinned Go uTLS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hello = Join-Path $env:RUNNER_TEMP "theia-utls-root-h2-hello.bin"
          try {
            Push-Location spikes/m0_1/utls_reference
            try {
              go mod verify
              if ($LASTEXITCODE -ne 0) { throw 'Go pinned dependency verification failed' }
              go run . $hello
              if ($LASTEXITCODE -ne 0) { throw 'Generate pinned Chrome133 uTLS reference failed' }
            } finally {
              Pop-Location
            }
            $env:THEIA_UTLS_HELLO_PATH = $hello
            cargo test --workspace --locked --test fingerprint_h2 -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Real Windows H2 fingerprint comparison failed' }
          } finally {
            Remove-Item Env:THEIA_UTLS_HELLO_PATH -ErrorAction SilentlyContinue
            Remove-Item $hello -Force -ErrorAction SilentlyContinue
          }
      - name: Disposable Windows user WinINet proxy CAS and restore (F-07)
        shell: pwsh
        env:
          THEIA_WINDOWS_PROXY_E2E_ALLOWED: "yes"
        run: |
          cargo test --workspace --locked windows_system_proxy::tests::native_wininet_cas_recovery_and_foreign_override -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'F-07 real WinINet proxy CAS and recovery failed' }
      - name: Cross-logon Windows pipe kernel-denial E2E (mandatory)
        shell: pwsh
        run: ./scripts/windows-cross-sid-ci.ps1
      - name: Stage Windows E2E binaries from Cargo JSON artifact paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Cargo may use target/debug/build/<crate>/<hash>/out instead of
          # target/debug/deps. Compiler-artifact JSON is the authoritative path.
          $testEvents = @(cargo test --workspace --locked --test f14_cross_host --no-run --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native F-14 harness' }
          $tests = @($testEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'f14_cross_host' -and $_.executable
          })
          if ($tests.Count -ne 1) { throw 'Expected exactly one compiled native F-14 test harness' }
          $binEvents = @(cargo build --workspace --locked --bin theia --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify compiled native Windows client' }
          $bins = @($binEvents | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theia' -and $_.executable
          })
          if ($bins.Count -ne 1) { throw 'Expected exactly one compiled Windows client executable' }
          if (!(Test-Path $tests[0].executable -PathType Leaf)) { throw 'Missing compiled F-14 test harness' }
          if (!(Test-Path $bins[0].executable -PathType Leaf)) { throw 'Missing compiled Windows client' }
          Copy-Item $tests[0].executable (Join-Path $env:RUNNER_TEMP 'f14_cross_host.exe')
          Copy-Item $bins[0].executable (Join-Path $env:RUNNER_TEMP 'theia.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: f14-windows-compiled
          path: |
            ${{ runner.temp }}/f14_cross_host.exe
            ${{ runner.temp }}/theia.exe
          if-no-files-found: error
          retention-days: 1
      - name: Native Windows release compilation only after main merge
        if: github.ref == 'refs/heads/main'
        run: cargo build --workspace --release --locked

  f14-cross-host:
    name: F-14 Linux VM server to native Windows client
    needs: [specification, rust-tests, windows-smoke]
    if: needs.specification.outputs.rust_ready == 'true'
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: f14-linux-server
          path: ${{ runner.temp }}/theia-linux
      - uses: actions/download-artifact@v4
        with:
          name: f14-windows-compiled
          path: ${{ runner.temp }}/theia-windows
      # Pin the audited v7.2.0 tag commit, not a mutable branch.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3 openssl
      - name: Prove separate Linux VM kernel before starting E2E
        shell: pwsh
        run: |
          $kernel = wsl.exe --distribution Ubuntu-24.04 -- uname -s
          if ($LASTEXITCODE -ne 0 -or $kernel.Trim() -ne 'Linux') { throw 'No real Linux WSL2 kernel' }
      - name: Run native Windows import and real Linux H2/H3 end-to-end
        shell: pwsh
        run: |
          python scripts/f14-cross-os-ci.py --linux-binary "$env:RUNNER_TEMP/theia-linux/theia" --windows-test "$env:RUNNER_TEMP/theia-windows/f14_cross_host.exe" --windows-client "$env:RUNNER_TEMP/theia-windows/theia.exe"
          if ($LASTEXITCODE -ne 0) { throw 'F-14 Linux/Windows cross-OS E2E failed' }

  browser-e2e:
    name: browser-e2e (${{ matrix.os }})
    needs: specification
    if: needs.specification.outputs.rust_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only Playwright
        run: python -m pip install playwright==1.65.2
      - name: Provision Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Provision Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Verify Chromium navigation through the built Theia client
        run: cargo test --workspace --locked --test client_h2 client_binary_chromium_socks5 -- --ignored --exact --nocapture
      - name: Capture actual Chromium H2 SETTINGS and HPACK pseudo names on loopback
        run: cargo test --workspace --locked --test chromium_h2_reference actual_chromium_h2_settings_and_pseudo_order_reference -- --ignored --exact --nocapture

  m3-3-bbr-comparison:
    name: m3-3-bbr-comparison (${{ matrix.os }})
    needs: specification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      THEIA_BBR_RESULTS_PATH: ${{ github.workspace }}/theia-bbr-${{ matrix.os }}.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m0_1 -> target"
          key: "m3-3-comparison"
      - name: Compare verified QUIC BBR and CUBIC with deterministic UDP impairment
        shell: pwsh
        run: |
          cargo test --manifest-path spikes/m0_1/Cargo.toml --locked --test quic_congestion_comparison comparison_records_all_controller_scenarios_ci_only -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison failed' }
      - name: Validate reproducibility and evidence coverage
        shell: pwsh
        run: |
          python tests/benchmark/check_bbr_comparison.py $env:THEIA_BBR_RESULTS_PATH
          if ($LASTEXITCODE -ne 0) { throw 'QUIC comparison validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-3-quic-comparison-${{ runner.os }}
          path: ${{ github.workspace }}/theia-bbr-${{ matrix.os }}.csv
          if-no-files-found: error

  m3-4-btls-spike:
    name: m3-4-btls-spike (${{ matrix.os }})
    needs: specification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spikes/m3_4 -> target"
          key: "m3-4-btls"
      - name: Real BoringSSL TCP first flight and strict TLS certificate matrix
        shell: pwsh
        run: |
          cargo test --manifest-path spikes/m3_4/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'BoringSSL candidate regressions failed' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - name: Compare real BoringSSL ClientHello to pinned Go uTLS Chrome133 reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hello = Join-Path $env:RUNNER_TEMP "theia-m3-4-utls-hello.bin"
          try {
            Push-Location spikes/m0_1/utls_reference
            try {
              go mod verify
              if ($LASTEXITCODE -ne 0) { throw 'Go dependency verification failed' }
              go run . $hello
              if ($LASTEXITCODE -ne 0) { throw 'Go ClientHello fixture generation failed' }
            } finally {
              Pop-Location
            }
            $env:THEIA_UTLS_HELLO_PATH = $hello
            cargo test --manifest-path spikes/m3_4/Cargo.toml --locked --test btls_h2 -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'BoringSSL on-wire comparison failed' }
          } finally {
            Remove-Item $hello -Force -ErrorAction SilentlyContinue
          }
      - name: Isolated Rust formatting and clippy
        shell: pwsh
        run: |
          cargo fmt --manifest-path spikes/m3_4/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'M3.4 rustfmt drift' }
          cargo clippy --manifest-path spikes/m3_4/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'M3.4 clippy failed' }

  m3-4e-btls-production-feature:
    name: m3-4e-btls-production-feature (${{ matrix.os }})
    needs: specification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Use canonical formatted sources for all tests
        shell: pwsh
        run: |
          tar -xf "$env:RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" -C .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply CI canonical formatting' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: "m3-4e-feature"
      - name: Verify production H2Client using optional BoringSSL TLS and real SmartTheia
        shell: pwsh
        run: |
          cargo test --workspace --locked --features experimental-btls-h2 --test client_btls_h2 -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Production BoringSSL H2/OPEN_OK regressions failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_wire_fingerprint -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4i actual H2 SETTINGS, WINDOW_UPDATE and pseudo capture failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_settings_feasibility -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4i bounded H2 flow-window API feasibility failed' }
          cargo test --workspace --locked --features experimental-btls-h2 --test h2_client_shape -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'M3.4j H2 request order and parameterized credit research failed' }
      - name: Rustfmt and feature Clippy fail on warnings
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'M3.4e rustfmt drift' }
          cargo clippy --workspace --all-targets --features experimental-btls-h2 -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'M3.4e feature Clippy failed' }

  ci-gate:
    name: ci-gate
    needs: [specification, m0-1-api-spike, m0-1-windows-spike, rust-tests, windows-smoke, f14-cross-host, browser-e2e, m3-3-bbr-comparison, m3-4-btls-spike, m3-4e-btls-production-feature]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success of every mandatory CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          expected = {"specification", "m0-1-api-spike", "m0-1-windows-spike", "rust-tests", "windows-smoke", "f14-cross-host", "browser-e2e", "m3-3-bbr-comparison", "m3-4-btls-spike", "m3-4e-btls-production-feature"}
          failed = [name for name in sorted(expected) if results.get(name, {}).get("result") != "success"]
          if failed:
              raise SystemExit("Required CI jobs did not succeed: " + ", ".join(failed))
          print("All required CI jobs succeeded.")
          PY

  persist-format:
    name: Persist canonical formatting after green gate
    needs: ci-gate
    if: ${{ github.event_name == 'pull_request' && needs.ci-gate.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: spikes/m0_1/utls_reference/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: ci-formatted-source
          path: ${{ runner.temp }}/ci-formatted-source
      - name: Persist only source bytes proven by the green CI jobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cargo fmt --all
          cargo fmt --manifest-path spikes/m0_1/Cargo.toml --all
          cargo fmt --manifest-path spikes/m3_4/Cargo.toml --all
          mapfile -d '' -t go_files < <(git ls-files -z -- '*.go')
          if (( ${#go_files[@]} )); then gofmt -w "${go_files[@]}"; fi
          python3 scripts/ci-format.py "$RUNNER_TEMP/rebuilt-formatted-source.tar"
          # Byte-for-byte identity: persist exactly the source files already
          # overlaid and tested by every mandatory job, never fresh edits.
          cmp "$RUNNER_TEMP/ci-formatted-source/ci-formatted-source.tar" \
              "$RUNNER_TEMP/rebuilt-formatted-source.tar"
          git diff --exit-code -- . ':!*.rs' ':!*.go'
          if git diff --quiet; then
            echo "Formatter made no changes: tested PR head is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' '*.go'
          git diff --cached --quiet && { echo "Nothing to persist"; exit 0; }
          git commit -m "style(ci): persist rustfmt and gofmt after passing tests"
          # A fast-forward push rejects PR branches changed since tests began.
          git push origin "HEAD:refs/heads/$HEAD_REF"
          # GITHUB_TOKEN pushes do not retrigger PR/push workflows.
          # No second full test run: git tree differs only by formatting
          # bytes that were already tested by the green ci-gate.
          echo "Saved exactly the CI-tested formatted files; no redundant rerun."
