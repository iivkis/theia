name: Profile diagnostics validation (isolated)
on:
  push:
    branches: [build/profile-diagnostics-09db264]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a30b9f1fae1ae582569cec178cf9d2fddfba4f2e
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "a30b9f1fae1ae582569cec178cf9d2fddfba4f2e"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Authenticated diagnostic consent and UDP relay regression
        run: cargo test -p theia --lib --locked real_local_proxy_modes_validate_credentials_and_relay_over_both_transports -- --nocapture
