name: Profile diagnostics validation (isolated)
on:
  push:
    branches: [build/profile-diagnostics-09db264]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 149b26d3dc769395febbe237ae73e186d76bdb6b
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "149b26d3dc769395febbe237ae73e186d76bdb6b"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Authenticated diagnostic consent and UDP relay regression
        run: |
          cargo test -p theia --lib --locked real_local_proxy_modes_validate_credentials_and_relay_over_both_transports -- --nocapture
          cargo test -p theia --lib --locked profile_diagnostics
          cargo test -p theia --lib --locked diagnostic_domain_editor_is_bounded_and_stages_only_on_explicit_save
          cargo test -p theia --lib --locked access_observation_is_bound_to_saved_inbound_user_and_fresh_reply
          cargo test -p theia --lib --locked tui_server_owns_startup_and_releases_listeners_on_confirmed_stop -- --nocapture
