name: Profile diagnostics validation (isolated)
on:
  push:
    branches: [build/profile-diagnostics-09db264]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09db26490ec2086c11a0a8dea4fa73b6d257d9b4
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "09db26490ec2086c11a0a8dea4fa73b6d257d9b4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Compile workspace and test targets
        run: cargo check --workspace --all-targets --locked
      - name: Diagnostics regression tests
        run: cargo test -p theia --lib --locked profile_diagnostics
      - name: Routing metadata regression
        run: cargo test -p theia --lib --locked diagnostic_metadata_preserves_legacy_wire
