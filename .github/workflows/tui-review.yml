name: Linux TUI visual review
on:
  push:
    branches: [build/tui-review]
    paths:
      - '.github/workflows/tui-review.yml'
      - 'tools/tui-review/**'
      - 'TUI-REVIEW.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-review-gallery
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Exact source snapshot for this review, not a moving branch.
          ref: 1d3b955a043e8eb6c9fa0cd61c130b34c6f5e9f1
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check preinstalled native and rendering tools
        shell: bash
        run: |
          set -euo pipefail
          # Hosted Ubuntu already ships most of these tools. Do not fetch
          # unversioned apt metapackages just to replace working installations.
          find_libclang() {
            python3 - <<'PY'
          import ctypes, glob, os
          paths = sorted(glob.glob("/usr/lib/llvm-*/lib/libclang.so*") +
                         glob.glob("/usr/lib/x86_64-linux-gnu/libclang-*.so*"),
                         reverse=True)
          for path in paths:
              try:
                  ctypes.CDLL(path)
              except OSError:
                  continue
              print(os.path.dirname(path))
              break
          else:
              raise SystemExit(1)
          PY
          }
          missing=()
          command -v cmake >/dev/null || missing+=(cmake)
          command -v clang >/dev/null || missing+=(clang)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          find_libclang >/dev/null || missing+=(libclang-dev)
          for font in DejaVuSansMono{,-Bold,-Oblique,-BoldOblique}.ttf; do
            if [[ ! -r "/usr/share/fonts/truetype/dejavu/$font" ]]; then
              missing+=(fonts-dejavu-core)
              break
            fi
          done
          # linux-ebpf-lab is not enabled in the locked default-feature review.
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          libclang="$(find_libclang)"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
          cmake --version
          clang --version
          pkg-config --version
          # Use a fixed Pillow version without apt's native dependency downloads.
          if python3 -c 'import PIL; assert PIL.__version__ == "12.1.1"' 2>/dev/null; then
            review_python="$(command -v python3)"
          else
            python3 -m venv "$RUNNER_TEMP/tui-review-python"
            review_python="$RUNNER_TEMP/tui-review-python/bin/python"
            "$review_python" -m pip --disable-pip-version-check install --only-binary=:all: Pillow==12.1.1
          fi
          "$review_python" -c 'from PIL import Image, ImageFont; ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 16)'
          echo "REVIEW_PYTHON=$review_python" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'source -> target'
          key: tui-review-linux-24.04-v2
          cache-workspace-crates: 'false'
      - name: Capture the real TUI renderer
        shell: bash
        run: |
          set -euo pipefail
          export THEIA_REVIEW_CELLS="$RUNNER_TEMP/theia-review-cells"
          export THEIA_REVIEW_FIXTURES="$RUNNER_TEMP/theia-review-fixtures"
          mkdir -m 700 "$THEIA_REVIEW_CELLS" "$THEIA_REVIEW_FIXTURES"
          mkdir -m 700 "$THEIA_REVIEW_FIXTURES/home" "$THEIA_REVIEW_FIXTURES/config"
          export HOME="$THEIA_REVIEW_FIXTURES/home"
          export XDG_CONFIG_HOME="$THEIA_REVIEW_FIXTURES/config"
          # Keep the installed compiler and Cargo cache after isolating HOME.
          export RUSTUP_HOME=/home/runner/.rustup
          export CARGO_HOME=/home/runner/.cargo
          unset THEIA_CONTROL_DIR THEIA_CONTROL_PIPE
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/crates/theia/src/tui.rs")
          marker = "mod tests {\n    use super::*;"
          code = p.read_text()
          assert code.count(marker) == 1, "TUI test module changed; update the gallery adapter"
          gallery = Path("review/tools/tui-review/gallery.rs").read_text()
          p.write_text(code.replace(marker, marker + "\n" + gallery, 1))
          wizard = Path("source/crates/theia/src/tui_reality_provision.rs")
          fixture = Path("review/tools/tui-review/reality-wizard-fixtures.rs").read_text()
          wizard.write_text(wizard.read_text() + "\n" + fixture)
          PY
          cd source
          source_sha="$(git rev-parse HEAD)"
          # Build the exact locked lib-test harness once. Keep each test in its
          # own process as before; no shared global state or parallel port races.
          build_json="$RUNNER_TEMP/tui-review-build.jsonl"
          if ! time cargo test --locked -p theia --lib --no-run --message-format=json-render-diagnostics > "$build_json"; then
            # rustc diagnostics are already printed on stderr by Cargo.
            echo "::error::Locked lib-test harness failed to compile"
            exit 1
          fi
          test_bin="$("$REVIEW_PYTHON" - "$build_json" <<'PY'
          import json, pathlib, sys
          candidates = []
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              item = json.loads(line)
              if (item.get("reason") == "compiler-artifact" and
                  item.get("target", {}).get("name") == "theia" and
                  "lib" in item["target"]["kind"] and
                  item.get("profile", {}).get("test") and item.get("executable")):
                  candidates.append(item["executable"])
          assert len(candidates) == 1, f"expected one lib-test harness, got {candidates}"
          print(candidates[0])
          PY
          )"
          test -x "$test_bin"
          inventory="$RUNNER_TEMP/tui-review-tests.txt"
          "$test_bin" --list --format terse > "$inventory"
          # Report every independent regression in one CI run; never publish on failure.
          failed=0
          test_started=$SECONDS
          for test in \
            first_key_import_creates_active_profile_and_opens_connection_panel \
            common_import_dispatches_reality_key_to_masked_review_and_cancels_without_writes \
            client_import_modal_masks_pasted_link_and_requires_explicit_confirmation \
            preview_binds_independent_identity_and_admission_without_exposing_secret \
            client_connection_modes_are_visible_and_do_not_start_or_write_on_selection \
            client_proxy_shortcut_refuses_dirty_or_unconfigured_editor \
            managed_key_import_has_no_extra_input_fields \
            compact_reality_with_three_maximum_dns_references_fits_access_key_limit \
            access_status_is_bounded_read_only_and_strictly_parsed \
            workspace_navigation_mouse_and_keyboard_never_commit_or_start \
            workspace_has_single_owner_for_every_visible_operation \
            workspace_import_and_monitor_are_inline_and_read_only \
            workspace_selected_user_and_advanced_actions_are_contextual \
            revocation_failure_replaces_entire_workspace \
            configured_sections_shortcut_uses_navigation_not_second_menu \
            server_overview_opens_recommended_workflow_without_starting \
            review_client_import_opens_directly_from_page_without_writing \
            workspace_actions_follow_record_mode_and_eligibility \
            server_workspace_action_selection_and_diagnostics_require_separate_consent \
            own_tls_status_only_offers_common_runtime_controls \
            runtime_stop_confirmation_and_disconnected_worker_are_observable \
            client_start_with_missing_saved_profile_reports_failure_without_runtime \
            model_navigation_help_and_safe_exit \
            form_keyboard_selects_record_and_field_without_implicit_activation \
            workspace_navigation_and_actions_do_not_write_on_focus \
            opens_existing_actions_without_requiring_shortcuts \
            action_selection_matches_rendered_rows_and_enter_dispatches_only_one_key \
            confirmation_choices_default_to_cancel_and_never_execute_on_focus \
            direct_profile_selection_wraps_long_addresses_without_activating \
            technical_status_is_opt_in_and_never_starts_a_worker \
            review_layout_keeps_actions_near_content_at_120_columns \
            dirty_draft_guards_quit_and_navigation_while_editing_is_isolated \
            compact_report_actions_follow_the_visible_text \
            diagnostics_menu_navigation_never_grants_network_consent \
            server_issuance_modal_hides_secret_until_durable_save_and_explicit_reveal \
            conflict_after_issuance_refuses_reveal_and_requires_retry_or_discard \
            rotation_modal_confirms_global_change_and_hides_new_secret_until_saved \
            invitation_offer_clears_workspace_and_keeps_reveal_explicit \
            novice_setup_and_source_choices_do_not_start_network_or_write \
            source_choice_rows_are_not_text_inputs_and_examples_are_visible \
            expanded_tls_and_result_views_never_approve_and_progress_is_bounded \
            save_recovery_does_not_retry_uncertain_or_changed_paths \
            reference_review_keeps_rejected_rows_and_long_values_visible \
            first_server_wizard_publishes_only_after_review_and_never_overwrites \
            multiline_domain_draft_preserves_cancel_and_bounds \
            reality_success_handoff_opens_key_draft_without_issuing_or_starting \
            inline_routing_actions_never_execute_on_focus \
            common_server_port_edits_both_listeners_only_after_validation \
            routing_workspace_reports_verified_ipc_and_stages_only_draft \
            geodata_automatic_activation_preserves_pending_edit_and_rejects_rollback \
            client_status_requires_canonical_fields_and_exact_revision_cas \
            real_local_proxy_modes_validate_credentials_and_relay_over_both_transports \
            pinned_sources_and_checksums \
            compact_cache_never_reuses_old_full_edition \
            unrelated_upstream_category_keys_do_not_break_selected_rules \
            conditional_snapshot_is_exact_and_rejects_ambiguous_headers \
            conditional_refresh_reuses_only_the_exact_verified_snapshot \
            cache_rejects_rollback_and_equivocation \
            direct_dial_and_relay \
            visual_review_gallery
          do
            echo "::group::$test"
            log="$RUNNER_TEMP/theia-review-$test.log"
            mapfile -t matches < <(awk -v filter="$test" '/: test$/ { sub(/: test$/, ""); if (index($0, filter)) print }' "$inventory")
            if (( ${#matches[@]} != 1 )); then
              echo "::error::Expected exactly one registered test for $test"
              failed=1
            elif ! "$test_bin" "${matches[0]}" --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. 1 passed; 0 failed' "$log"; then
              echo "::error::Expected exactly one passing test: $test"
              failed=1
            fi
            echo "::endgroup::"
          done
          test "$failed" -eq 0
          echo "Selected test execution: $((SECONDS - test_started)) seconds"
          time "$REVIEW_PYTHON" ../review/tools/tui-review/render.py "$THEIA_REVIEW_CELLS" "$RUNNER_TEMP/tui-gallery" --source-sha "$source_sha"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-review-linux
          path: ${{ runner.temp }}/tui-gallery
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/build/tui-review'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/tui-review
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: tui-review-linux
          path: ${{ runner.temp }}/tui-gallery
      - name: Validate and publish only gallery files
        shell: bash
        run: |
          set -euo pipefail
          # Do not let an older run overwrite a newer review-input revision.
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git diff --quiet "$GITHUB_SHA" HEAD -- . ':(exclude)screenshots/**'
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, struct
          from pathlib import Path
          src = Path(os.environ["RUNNER_TEMP"]) / "tui-gallery"
          manifest = json.loads((src / "manifest.json").read_text())
          assert manifest["source_sha"] == "1d3b955a043e8eb6c9fa0cd61c130b34c6f5e9f1"
          assert (manifest["platform"], manifest["columns"], manifest["rows"]) == ("linux",120,40)
          expected = {"manifest.json", "README.md"}
          for entry in manifest["screens"]:
              name = entry["file"]
              assert re.fullmatch(r"[a-z0-9-]+\.png", name) and name not in expected
              expected.add(name)
              f = src / name
              assert f.is_file() and not f.is_symlink()
              data = f.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", data[16:24]) == (1200,840)
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
          required_wizard = set(["server-first-reality-dns-expanded.png","state-reality-step4-tls-consent.png","state-reality-step4-tls-progress.png","state-reality-step4-tls-recheck.png","state-reality-step5-ranked-review.png","state-reality-step5-no-eligible.png","state-reality-step6-saving.png","state-reality-step6-save-error.png","state-reality-step6-save-uncertain.png"])
          required_wizard.update(["state-reality-step4-tls-expanded.png","state-reality-step3-dns-progress.png","state-reality-step5-ranked-expanded.png","state-reality-step5-long-report.png","state-reality-step5-no-eligible-expanded.png","state-reality-step6-save-inspection.png","state-reality-step6-success.png","state-reality-step2-extra-sources.png","state-reality-step1-grant-picker.png"])
          required_wizard.update(["state-reality-step2-domain-editor.png","state-reality-step5-long-report-scrolled.png","state-reality-step6-key-handoff.png"])
          assert required_wizard <= expected, f"missing REALITY wizard screenshots: {required_wizard - expected}"
          required_navigation = set(["server-page-overview.png","server-page-connections.png","server-page-users.png","server-page-users-disabled.png","server-page-management.png","server-page-traffic.png","server-page-settings.png","server-page-diagnostics.png","client-page-overview.png","client-page-profiles.png","client-page-import.png","client-page-proxy.png","client-page-traffic.png","client-page-settings.png","server-overview-next-step.png","client-overview-next-step.png","server-sections-focus.png","client-sections-focus.png","client-action-invitation-import.png","server-action-recover-user.png"])
          obsolete_navigation = set(["server-page-invitations.png","client-action-reality-import.png","server-command-menu.png","client-command-menu.png","server-focus-actions.png","client-focus-actions.png","server-action-apply-rights.png","server-action-restart-preflight.png","server-traffic-monitor-idle.png","server-action-server-process.png","server-action-delete-user.png"])
          required_navigation.update(["server-page-advanced.png","client-page-advanced.png","client-page-import-masked.png","server-page-users-ungranted.png","server-action-delete-user-confirm.png"])
          required_navigation.update(["server-page-routing.png","client-page-routing.png","client-page-diagnostics.png","server-routing-rules.png","server-routing-edit.png","server-routing-geodata.png","server-page-users-observed.png","client-routing-fresh.png","client-routing-expired.png","client-routing-unconfirmed.png"])
          assert required_navigation <= expected, f"missing navigation screenshots: {required_navigation - expected}"
          assert not obsolete_navigation & expected, "obsolete duplicate navigation screenshots"
          assert len(expected) >= 52
          assert {p.name for p in src.iterdir()} == expected
          dst = Path("screenshots")
          if dst.exists():
              assert dst.is_dir() and not dst.is_symlink()
              shutil.rmtree(dst)
          dst.mkdir()
          for name in sorted(expected):
              assert not (src / name).is_symlink()
              shutil.copyfile(src / name, dst / name)
          PY
          git add -A -- screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish Linux TUI visual review [skip ci]"
          git push origin HEAD:refs/heads/build/tui-review

