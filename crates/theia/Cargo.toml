[package]
name = "theia"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.8.23"
base64 = "=0.22.1"
bytes = "=1.10.1"
h2 = "=0.4.19"
http = "=1.3.1"
rustls = { version = "=0.23.46", features = ["ring"] }
rustls-pemfile = "=2.2.0"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = "=0.26.6"

[dev-dependencies]
rcgen = "=0.13.2"
