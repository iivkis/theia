[package]
name = "theia"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# F-13 laboratory backend remains compiled for independent tests.
# The product config does not expose a selectable browser security mode.
default = ["experimental-btls-h2"]
experimental-btls-h2 = ["dep:btls", "dep:tokio-btls"]

[dependencies]
btls = { version = "=0.5.6", optional = true }
tokio-btls = { version = "=0.5.6", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
regex = "=1.13.2"
flate2 = "=1.1.9"
toml = "=0.8.23"
ratatui = "=0.29.0"
crossterm = "=0.28.1"
# Local QR generation and bounded offline image decoding, no external process.
qrcode = { version = "=0.14.1", default-features = false }
png = "=0.18.1"
quircs = "=0.10.3"
base64 = "=0.22.1"
bytes = "=1.10.1"
h2 = "=0.4.19"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = "=0.11.12"
http = "=1.3.1"
rustls = { version = "=0.23.46", features = ["ring"] }
rustls-pemfile = "=2.2.0"
rustls-native-certs = "=0.8.5"
sha2 = "=0.10.9"
# Existing locked ring package: TLS exporter-bound HTTP admission HMAC.
ring = "=0.17.14"
subtle = "=2.6.1"
zeroize = "=1.9.2"
# Independent identity-signed short-lived TLS leaves, using existing locked libraries.
rcgen = "=0.13.2"
time = "=0.3.55"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = "=0.26.6"

[dev-dependencies]
# Deterministic liveness deadlines; no new package or production feature.
tokio = { version = "=1.52.1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
