# F-20 offline configuration example. No network or proxy changes on validation.
# Empty routing deliberately applies no Anti-DPI rules. Resolver selection and
# consent must be explicit; runtime Connect is not implemented by this example.
schema_version = 1

[anti_dpi]
id = "local"
revision = 1
ingress_mode = "system_proxy"
rules = []

[anti_dpi.proxy]
http_listen = "127.0.0.1:8080"
socks5_listen = "127.0.0.1:1080"

[anti_dpi.consent]
direct_egress = false
direct_dpi = false
direct_dpi_stun = false

[management]
ipc = "auto"
log_level = "info"

[ui]
language = "ru"
