# TEMPLATE ONLY: replace edge.example.org and provision token via env/secure file.
schema_version = 1

[client]
active_profile = "home"

[[client.profiles]]
id = "home"
server = "edge.example.org:443"
server_name = "edge.example.org"
# THEIA_AUTH_TOKEN must contain base64url(no-padding) of 32 random bytes.
auth_token = "env:THEIA_AUTH_TOKEN"
tls_profile = "default"
# Explicit CA bundle for explicit H2/H3 runtime (optional for structural validation).
# tls_ca = "file:/absolute/path/to/ca-bundle.pem"
# Auto tries QUIC first; only a no-response UDP handshake permits H2 fallback.
transport = "auto"
quic_connect_timeout_ms = 1600
quic_negative_cache_ttl_s = 900

[client.proxy]
http_listen = "127.0.0.1:7890"
socks5_listen = "127.0.0.1:7891"
# Only off/manual are allowed. Manual needs a separate user-confirmed TUI action.
system_proxy = "off"

[management]
ipc = "auto"
log_level = "info"

[ui]
language = "ru"
