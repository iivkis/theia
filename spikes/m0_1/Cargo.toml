[package]
name = "theia-m0-1-feasibility"
version = "0.0.0"
edition = "2021"
publish = false

# Isolated feasibility crate; not the production theia workspace.
[dependencies]
bytes = "1.10"
h2 = "=0.4.19"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1.3"
quinn = "=0.11.12"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }

[dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "=0.23.46", features = ["ring"] }
